<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教師舒心療癒儀表板</title>
    <!-- 引入 Google Fonts (優雅的明體與圓潤的黑體) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet">
    
    <!-- 整合 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind 自訂色票與字體設定 -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sand: '#F4EFE6',    /* 燕麥沙色 (背景) */
                        sage: '#C3D3C4',    /* 鼠尾草綠 (盼望燈塔) */
                        clay: '#DDA793',    /* 赤陶土色 (維他命) */
                        slate: '#A3B1C6',   /* 迷霧藍 (呼吸) */
                        stone: '#8B8C89',   /* 灰石色 (智慧小語) */
                        blush: '#E5B8B7',   /* 柔粉色 (被聊療) */
                        forest: '#2C3D30',  /* 深林綠 (主文字) */
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        serif: ['"Noto Serif TC"', 'serif'],
                    },
                    animation: {
                        'blob': 'blob 10s infinite alternate',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* 基礎設定 */
        body {
            background-color: #F4EFE6;
            color: #2C3D30;
            overflow-x: hidden;
        }

        /* 柔和毛玻璃卡片 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 2rem;
            box-shadow: 0 10px 40px -10px rgba(0,0,0,0.03);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-panel:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.06);
            background: rgba(255, 255, 255, 0.5);
        }

        /* 有機流體形狀 (呼吸球) */
        .organic-blob {
            width: 140px;
            height: 140px;
            background: linear-gradient(135deg, #A3B1C6 0%, #E3E8EE 100%);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 500;
            letter-spacing: 0.1em;
            cursor: pointer;
            box-shadow: inset 10px 10px 20px rgba(255,255,255,0.5), 
                        0 15px 35px rgba(163,177,198,0.3);
            transition: all 0.5s ease-in-out;
            animation: morph 8s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes morph {
            0%, 100% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; }
            34% { border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%; }
            67% { border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%; }
        }

        /* 自訂捲軸 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(139, 140, 137, 0.3); border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen relative selection:bg-sage selection:text-forest flex flex-col">

    <!-- 背景動態環境光暈 (Ambient Light) -->
    <div class="fixed inset-0 z-[-1] overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[40rem] h-[40rem] bg-sage/30 rounded-full mix-blend-multiply filter blur-[100px] animate-blob"></div>
        <div class="absolute top-[20%] right-[-10%] w-[35rem] h-[35rem] bg-clay/20 rounded-full mix-blend-multiply filter blur-[100px] animate-blob" style="animation-delay: 2s;"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-[40rem] h-[40rem] bg-slate/20 rounded-full mix-blend-multiply filter blur-[100px] animate-blob" style="animation-delay: 4s;"></div>
        <div class="absolute bottom-[10%] right-[10%] w-[30rem] h-[30rem] bg-blush/20 rounded-full mix-blend-multiply filter blur-[100px] animate-blob" style="animation-delay: 6s;"></div>
    </div>

    <div class="max-w-7xl mx-auto px-6 py-12 md:py-16 flex-grow w-full">
        
        <!-- 頂部問候區 -->
        <header class="text-center mb-12 animate-float" style="animation-duration: 8s;">
            <h1 class="font-serif text-4xl md:text-5xl font-bold text-forest mb-4 tracking-widest">

            </h1>

            </p>
        </header>

        <!-- 主體佈局 -->
        <main class="grid grid-cols-1 md:grid-cols-12 gap-8">

            <!-- 1. 盼望燈塔 (橫跨全幅) -->
            <section class="glass-panel p-8 md:p-10 col-span-1 md:col-span-12 relative overflow-hidden group">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 border-b border-forest/10 pb-4">
                    <div>
                        <h2 class="font-serif text-2xl text-forest font-bold mb-1 flex items-center">
                            <span class="bg-sage/40 p-2 rounded-full mr-3 text-xl">🕊️</span> 盼望燈塔
                        </h2>
                        <p class="text-sm text-forest/60 font-sans tracking-wide">看看距離不用調鬧鐘的日子還有多遠</p>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                        <div class="font-serif text-3xl md:text-4xl text-forest mb-2" id="weekend-countdown">--</div>

                    </div>
                    <!-- 連假 -->

                        <h3 class="text-forest/70 font-bold mb-3 tracking-widest text-sm" id="holiday-name">最近連假</h3>
                        <div class="font-serif text-3xl md:text-4xl text-forest mb-2" id="holiday-countdown">--</div>

                    <!-- 寒假 -->
                    <div class="bg-white/40 rounded-3xl p-6 text-center transition-all duration-300 hover:bg-white/60">
                        <h3 class="text-forest/70 font-bold mb-3 tracking-widest text-sm">寒假來臨</h3>
                        <div class="font-serif text-3xl md:text-4xl text-forest mb-2" id="winter-countdown">--</div>

            <!-- 2. 四大互動區塊 (橫跨全幅，內部四等分) -->

                <!-- 甜寵：每日被聊療 -->

                    <h2 class="font-serif text-xl text-pink-600 font-bold mb-4 flex items-center justify-center">

            <!-- 3. 隱形盔甲：法規智庫 (橫跨全幅) -->

                    </div>
                </div>

                </div>

                <div id="law-result-area" class="hidden mt-6 bg-white/40 rounded-3xl p-6 border border-white/60 max-h-80 overflow-y-auto">

    <!-- 頁尾宣告 -->

    <!-- Vanilla JavaScript 邏輯實作 -->
    <script>
        // --- 1. 盼望燈塔：假期倒數計算 ---
        function getTimeLeftString(targetDate) {
            const now = new Date();
            const diff = targetDate - now;
            if (diff <= 0) return null; 
            
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const mins = Math.floor((diff / 1000 / 60) % 60);
            return `<span class="text-4xl md:text-5xl">${days}</span><span class="text-base text-forest/60 mx-1">天</span> <span class="text-3xl">${hours}</span><span class="text-base text-forest/60 mx-1">時</span> <span class="text-3xl">${mins}</span><span class="text-base text-forest/60 ml-1">分</span>`;
        }

        function getNextWeekend() {
            const now = new Date();
            let target = new Date(now);
            if ((now.getDay() === 5 && now.getHours() >= 16) || now.getDay() === 6 || now.getDay() === 0) {
                const daysToNextFriday = (5 - now.getDay() + 7) % 7;
                const addDays = daysToNextFriday === 0 ? 7 : daysToNextFriday;
                target.setDate(now.getDate() + addDays);
            } else {
                target.setDate(now.getDate() + (5 - now.getDay()));
            }
            target.setHours(16, 0, 0, 0);
            return target;
        }

        const upcomingHolidays = [
            { name: "光復節連假", date: new Date("2026-10-23T16:00:00") },   
            { name: "行憲紀念日連假", date: new Date("2026-12-24T16:00:00") }, 
            { name: "元旦連假", date: new Date("2026-12-31T16:00:00") }    
        ];

        function getNextHoliday() {
            const now = new Date();
            for (let h of upcomingHolidays) {
                if (h.date > now) return h;
            }
            return null; 
        }

        const winterVacationDate = new Date("2027-01-20T16:00:00");

        function updateAllCountdowns() {
            const weekendStr = getTimeLeftString(getNextWeekend());
            document.getElementById('weekend-countdown').innerHTML = weekendStr || '<span class="text-3xl">放假中 🎉</span>';

            const nextHoliday = getNextHoliday();
            if (nextHoliday) {
                document.getElementById('holiday-name').innerText = nextHoliday.name;
                document.getElementById('holiday-countdown').innerHTML = getTimeLeftString(nextHoliday.date);
            } else {
                document.getElementById('holiday-name').innerText = "近期無連假";
                document.getElementById('holiday-countdown').innerHTML = '<span class="text-2xl text-forest/40">---</span>';
            }

            const winterStr = getTimeLeftString(winterVacationDate);
            document.getElementById('winter-countdown').innerHTML = winterStr || '<span class="text-3xl">寒假中 ⛄</span>';
        }

        setInterval(updateAllCountdowns, 60000);
        updateAllCountdowns(); 


        // --- 2. 專屬綠洲：4-7-8 呼吸法 ---
        const breatheBtn = document.getElementById('breathe-btn');
        const breatheInstruction = document.getElementById('breathe-instruction');
        let isBreathing = false;

        breatheBtn.addEventListener('click', () => {
            if (isBreathing) return;
            isBreathing = true;
            breatheBtn.innerText = "吸氣";
            breatheInstruction.innerText = "由鼻子深深吸氣 4 秒";
            breatheBtn.style.transform = "scale(1.3)";
            breatheBtn.style.transitionDuration = "4s";
            breatheBtn.style.background = "linear-gradient(135deg, #C3D3C4 0%, #E3E8EE 100%)";

            setTimeout(() => {
                breatheBtn.innerText = "憋氣";
                breatheInstruction.innerText = "屏住呼吸 7 秒";
                breatheBtn.style.transform = "scale(1.3)"; 
                
                setTimeout(() => {
                    breatheBtn.innerText = "呼氣";
                    breatheInstruction.innerText = "由嘴巴緩慢吐氣 8 秒";
                    breatheBtn.style.transform = "scale(1)";
                    breatheBtn.style.transitionDuration = "8s";
                    breatheBtn.style.background = "linear-gradient(135deg, #A3B1C6 0%, #E3E8EE 100%)";

                    setTimeout(() => {
                        breatheBtn.innerText = "START";
                        breatheInstruction.innerText = "做得好。點擊可再次開始。";
                        isBreathing = false;
                    }, 8000);
                }, 7000);
            }, 4000);
        });

        // --- 3. 靈魂維他命、智慧小語、每日被聊療 ---
        const vitamins = [
            "你今天點進來照顧自己，這點就值得一個大大的擁抱。",
            "又撐過了一天，你的存在本身就是一種教育。",
            "懂老師才懂的幽默：備課的最高境界，就是發現去年的教材還能用。",
            "行動小任務：今天下班去買一杯自己最喜歡的飲料吧！",
            "親師溝通再累，也別忘了對鏡子裡的自己說聲：辛苦了，你做得很棒。",
            "教育是一場馬拉松，配速很重要。允許自己今天有 10% 的時間是「放空狀態」。"
        ];
        
        const wisdoms = [
            "你現在在生氣的學生，頂多相處幾小時，幾年後就離開了。倒楣的是要跟他相處最多的家人，不是你。",
            "設定界線可能會讓某些人不開心，但能幫你過濾掉消耗你的錯誤關係。",
            "當你感到胸悶、委屈、焦慮或想翻白眼時，這就是身體在告訴你「界線被越界了」。",

            "如果對方施壓或情緒勒索，請重複你的底線，不輕易退讓。",
            "不要把別人的情緒當作自己的責任。守衛情緒界線，讓人際關係不再左右為難。",
            "一個精疲力竭的老師，很難教出快樂的孩子。先照料好自己的心，才有能量照亮他人。",
            "教育是一場馬拉松，允許自己有辦不到的時候。不完美的老師，更能教會孩子如何面對挫折。"
        ];

        const flirts = [
            "哥倫布發現新大陸，而我發現了你",
            "你的缺點連顯微鏡都找不出來",
            "因為你，我的心漏跳了一拍。",
            "不必開電腦，我的腦已被你電到",
            "我最想解開的難題是你的心",
            "因為有你，讓這世界特別起來。",
            "別問我 How are you? 我只會一句 I Love you",
            "你就是我的萬有引力",
            "如果喜歡你是犯法，我願意以身試法",
            "世上最美的笑容，是你對我笑",
            "CPR一定要學，因為妳美的讓我無法呼吸",
            "學生沒有把老師放在眼裡，是因為把我們放在心裡。"
        ];

        function changeBoxText(elementId, array) {
            const boxText = document.getElementById(elementId);
            const randomIndex = Math.floor(Math.random() * array.length);
            boxText.style.opacity = 0;
            setTimeout(() => {
                boxText.innerHTML = array[randomIndex];
                boxText.style.opacity = 1;
            }, 300);
        }

        function openVitaminBox() { changeBoxText('vitamin-box-text', vitamins); }
        function openWisdomBox() { changeBoxText('wisdom-box-text', wisdoms); }
        function openFlirtBox() { changeBoxText('flirt-box-text', flirts); }

        // --- 4. 隱形盔甲：法規智庫檢索 ---
        const legalDB = [
            {
                keywords: ["管教", "體罰", "罰站", "罰寫", "處罰", "不當管教"],
                title: "管教與體罰的合法界線",
                content: `依據《學校訂定教師輔導與管教學生辦法注意事項》：<br>
                ✅ <b>合法管教</b>：需具備正當教育目的並符合比例原則。可實施「有時間限制」的站立反省、適當增加作業或工作。<br>
                ❌ <b>違法/不當</b>：嚴禁體罰、不可強迫學生寫「悔過書」（侵害表意自由）、不能限制學生參加「正式課程」內的學校活動。<br>
                💡 <b>建議SOP</b>：適度給予學生陳述意見機會。若學生對處罰有異議，教師應調整或停止，必要時移請學務處處置。`
            },
            {
                keywords: ["性平", "性騷擾", "性侵害", "性霸凌", "通報"],
                title: "校園性平事件處理流程",

        function searchLaw() {
            const input = document.getElementById('law-search-input').value.toLowerCase();
            const resultArea = document.getElementById('law-result-area');
            resultArea.style.display = 'block'; 
            
            if (!input.trim()) {
                resultArea.innerHTML = '<p class="text-forest/60 text-center py-4 font-serif">請輸入關鍵字，例如：「管教」或「提告」。</p>';
                return;
            }

            const results = legalDB.filter(item => 
                item.keywords.some(kw => input.includes(kw)) || item.title.includes(input)
            );

            if (results.length > 0) {
                let html = '<ul class="space-y-4">';
                results.forEach(res => {
                    html += `
                    <li class="p-6 bg-white/50 rounded-2xl shadow-sm border-l-4 border-sage">
                        <h3 class="font-serif font-bold text-forest text-lg mb-3">${res.title}</h3>
                        <p class="text-sm text-forest/80 leading-loose">${res.content}</p>
                    </li>`;
                });
                html += '</ul>';
                resultArea.innerHTML = html;
            } else {
                resultArea.innerHTML = `
                <div class="text-center py-6">
                    <p class="text-forest/70 mb-2 font-serif">目前法規庫未找到完全匹配的關鍵字。</p>
                    <p class="text-sm text-slate">💡 建議嘗試輸入：管教、性平、提告、隱私、通報</p>
                </div>`;
            }
        }

        document.getElementById('law-search-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchLaw();
        });
    </script>
